<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시장 상세</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/css/telegram-theme.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
<div class="container pb-nav">
  <div id="header" class="page-title">시장 상세</div>
  <div id="index-card"><div class="loading">로딩 중…</div></div>
  <div class="page-title" style="margin-top:20px;font-size:15px">상위 종목</div>
  <div id="top-list"><div class="loading">로딩 중…</div></div>
</div>

<nav class="bottom-nav">
  <a href="/index.html"><span class="icon">📊</span>시장</a>
  <a href="/stock.html"><span class="icon">🔍</span>종목</a>
  <a href="/news.html"><span class="icon">📰</span>뉴스</a>
  <a href="/watchlist.html"><span class="icon">⭐</span>관심</a>
  <a href="/settings.html"><span class="icon">⚙️</span>설정</a>
</nav>

<script type="module">
import { api } from "/static/js/api.js";
import { fmtNum, fmtPct, badgeClass, showError } from "/static/js/utils.js";

const params = new URLSearchParams(location.search);
const id = params.get("id") || "sh_main";

const headerEl = document.getElementById("header");
const cardEl   = document.getElementById("index-card");
const listEl   = document.getElementById("top-list");

api.getMarket(id).then(m => {
  headerEl.textContent = m.name;
  const cls = badgeClass(m.change_pct);
  cardEl.innerHTML = `
    <div class="card">
      <div class="index-value">${fmtNum(m.close)}</div>
      <div class="index-change">
        <span class="${cls}">${fmtPct(m.change_pct)}</span>
        <span style="color:var(--tg-hint);font-size:12px;margin-left:6px">${m.date}</span>
      </div>
      <div style="margin-top:10px;display:flex;gap:16px;font-size:13px;color:var(--tg-hint)">
        <span>시가 ${fmtNum(m.open)}</span>
        <span>고가 ${fmtNum(m.high)}</span>
        <span>저가 ${fmtNum(m.low)}</span>
      </div>
    </div>`;
}).catch(e => showError(cardEl, "지수 데이터 없음"));

api.getTopStocks(id, 20).then(stocks => {
  if (!stocks.length) { listEl.innerHTML = "<div class='loading'>데이터 없음</div>"; return; }
  listEl.innerHTML = stocks.map(s => {
    const ticker = s["代码"] || s.ticker || "";
    const name   = s["名称"] || s.name || ticker;
    const price  = s["最新价"] || s.close || 0;
    const chgPct = s["涨跌幅"] || s.change_pct || 0;
    const cls = badgeClass(chgPct);
    return `
    <div class="card" onclick="location.href='/stock.html?ticker=${ticker}'">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="card-title">${name}</div><div style="color:var(--tg-hint);font-size:12px">${ticker}</div></div>
        <div style="text-align:right">
          <div style="font-weight:600">${fmtNum(price)}</div>
          <span class="${cls}">${fmtPct(chgPct)}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}).catch(e => showError(listEl, "종목 데이터 없음"));
</script>
</body>
</html>
