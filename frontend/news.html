<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴스</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/css/telegram-theme.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
<style>
.filter-bar { display:flex; gap:8px; overflow-x:auto; padding:8px 0; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.filter-chip { flex-shrink:0; padding:4px 12px; border-radius:20px; font-size:12px;
  background:var(--tg-section-bg); color:var(--tg-hint); cursor:pointer; border:1px solid transparent; }
.filter-chip.active { background:var(--tg-button-color); color:var(--tg-button-text-color); }
.news-source { font-size:11px; color:var(--tg-link-color); margin-top:2px; }
.news-title-orig { font-size:11px; color:var(--tg-hint); margin-top:2px; }
.news-desc { font-size:12px; color:var(--tg-text-color); margin-top:4px; line-height:1.5; }
</style>
</head>
<body>
<div class="container pb-nav">
  <div class="page-title">📰 뉴스</div>
  <div class="tab-bar" id="market-tabs">
    <div class="tab active" data-market="all">전체</div>
    <div class="tab" data-market="sh_main">상해</div>
    <div class="tab" data-market="sz_main">선전</div>
    <div class="tab" data-market="star">과창판</div>
    <div class="tab" data-market="hk">홍콩</div>
  </div>
  <div class="filter-bar" id="source-chips">
    <div class="filter-chip active" data-source="all">전체 출처</div>
    <div class="filter-chip" data-source="财联社전보">财联社전보</div>
    <div class="filter-chip" data-source="财联社인기">财联社인기</div>
    <div class="filter-chip" data-source="东方财富리서치">东方财富리서치</div>
    <div class="filter-chip" data-source="东方财富A株">东方财富A株</div>
    <div class="filter-chip" data-source="新浪财经">新浪财경</div>
    <div class="filter-chip" data-source="上交所공시">上交所공시</div>
    <div class="filter-chip" data-source="SCMP">SCMP</div>
    <div class="filter-chip" data-source="Reuters">Reuters</div>
  </div>
  <div id="news-list"><div class="loading">로딩 중…</div></div>
</div>

<nav class="bottom-nav">
  <a href="/index.html"><span class="icon">📊</span>시장</a>
  <a href="/stock.html"><span class="icon">🔍</span>종목</a>
  <a href="/news.html" class="active"><span class="icon">📰</span>뉴스</a>
  <a href="/watchlist.html"><span class="icon">⭐</span>관심</a>
  <a href="/settings.html"><span class="icon">⚙️</span>설정</a>
</nav>

<script type="module">
import { api } from "/static/js/api.js";
import { showError } from "/static/js/utils.js";

const listEl = document.getElementById("news-list");
let currentMarket = "all";
let currentSource = "all";

async function load() {
  listEl.innerHTML = '<div class="loading">로딩 중…</div>';
  try {
    const items = await api.getNews(currentMarket, currentSource);
    if (!items.length) { listEl.innerHTML = '<div class="loading">뉴스 없음</div>'; return; }
    listEl.innerHTML = items.map(n => {
      const url = n.link || "";
      const src = n.source || "";
      const time = n.published ? n.published.slice(0,16).replace("T"," ") : "";
      const titleKo = n.title_ko || "";
      const titleOrig = n.title || "";
      const descKo = n.description_ko || "";
      return `
      <div class="news-item" ${url ? `onclick="open('${url}','_blank')"` : ""} style="${url?'cursor:pointer':''}">
        ${titleKo
          ? `<div class="news-title">${titleKo}</div>
             <div class="news-title-orig">${titleOrig}</div>`
          : `<div class="news-title">${titleOrig}</div>`}
        ${descKo ? `<div class="news-desc">${descKo}</div>` : ""}
        <div class="news-meta">${time}</div>
        ${src ? `<div class="news-source">${src}</div>` : ""}
      </div>`;
    }).join("");
  } catch(e) { showError(listEl, "뉴스를 불러올 수 없습니다."); }
}

document.getElementById("market-tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  currentMarket = tab.dataset.market;
  load();
});

document.getElementById("source-chips").addEventListener("click", e => {
  const chip = e.target.closest(".filter-chip");
  if (!chip) return;
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  currentSource = chip.dataset.source;
  load();
});

load();
</script>
</body>
</html>
