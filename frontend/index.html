<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중국·홍콩 증시</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/css/telegram-theme.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
<div class="container pb-nav">
  <div class="page-title">📊 시장 현황</div>
  <div id="market-list"><div class="loading">데이터 로딩 중…</div></div>
</div>

<nav class="bottom-nav">
  <a href="/index.html" class="active"><span class="icon">📊</span>시장</a>
  <a href="/stock.html"><span class="icon">🔍</span>종목</a>
  <a href="/news.html"><span class="icon">📰</span>뉴스</a>
  <a href="/watchlist.html"><span class="icon">⭐</span>관심</a>
  <a href="/settings.html"><span class="icon">⚙️</span>설정</a>
</nav>

<script type="module">
import { api } from "/static/js/api.js";
import { fmtNum, fmtPct, badgeClass, showError } from "/static/js/utils.js";

const list = document.getElementById("market-list");

api.getMarkets().then(markets => {
  list.innerHTML = markets.map(m => {
    const cls = badgeClass(m.change_pct);
    return `
    <div class="card" onclick="location.href='/market.html?id=${m.market_id}'">
      <div class="card-title">${m.name}</div>
      <div class="index-value">${fmtNum(m.close)}</div>
      <div class="index-change">
        <span class="${cls}">${fmtPct(m.change_pct)}</span>
        <span style="color:var(--tg-hint);font-size:12px;margin-left:6px">${m.date}</span>
      </div>
    </div>`;
  }).join("");
}).catch(e => showError(list, "데이터를 불러올 수 없습니다."));
</script>
</body>
</html>
