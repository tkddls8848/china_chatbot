services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      RSSHUB_BASE_URL: http://rsshub:1200
    env_file:
      - .env
    depends_on:
      rsshub:
        condition: service_healthy
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 1800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
